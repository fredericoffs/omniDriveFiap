services:
  postgres:
    build: docker/postgres
    image: omnidrive-postgres:18
    environment:
      POSTGRES_DB: omnidrive
      POSTGRES_USER: omnidrive
      POSTGRES_PASSWORD: omnidrive
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidrive -d omnidrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: omnidrive-app:0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/omnidrive
      DB_USERNAME: omnidrive
      DB_PASSWORD: omnidrive
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-omnidrive-dev-webhook-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  postgres-data:
